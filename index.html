<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yahia RideShare - v5</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family:'Cairo',sans-serif;
    direction:rtl;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    min-height:100vh;
}
header {
    background:#000;
    color:#fff;
    padding:1rem;
    text-align:center;
}
.container { max-width: 800px; margin: 0 auto; padding: 1rem; }
.auth-box {
    max-width: 400px;
    margin: 2rem auto;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
    padding: 2rem;
    border-radius: 12px;
    color: #fff;
}
input, select, button {
    width: 100%;
    padding: 0.8rem;
    margin: 0.5rem 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family:'Cairo',sans-serif;
    font-size: 14px;
}
button {
    background: #111;
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: bold;
}
button:hover { background: #333; }
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.tabs button { width: auto; padding: 0.6rem 1rem; background: #666; margin: 0; border-radius: 6px; }
.tabs button.active { background: #111; }
.page { display: none; }
.page.active { display: block; }
.card {
    background: rgba(255,255,255,0.95);
    color: #111;
    padding: 1rem;
    margin: 0.5rem 0;
    border-radius: 10px;
}
.group-btn {
    background: rgba(100,200,255,0.15);
    color: #fff;
    padding: 1rem;
    margin: 0.5rem 0;
    border: 2px solid #3498db;
    border-radius: 10px;
    cursor: pointer;
    text-align: right;
    font-size: 16px;
    font-weight: bold;
}
.group-btn:hover { background: rgba(100,200,255,0.25); }
.badge {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    font-size: 12px;
}
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    margin-bottom: 1rem;
}
.topbar button { width: auto; padding: 0.5rem 1rem; }
.empty { text-align: center; padding: 2rem; opacity: 0.7; color: #fff; }
.status { font-size: 12px; opacity: 0.8; color: #aaa; }
.error { color: #e74c3c; font-size: 12px; }
.success { color: #27ae60; font-size: 12px; }
</style>
</head>
<body>
<header>
<h1>Yahia RideShare - v5</h1>
</header>

<!-- AUTH -->
<div id="authBox" class="auth-box">
<div style="display: flex; gap: 10px; margin-bottom: 1.5rem;">
  <button onclick="switchAuthTab('signup')" id="signupTab" style="width: 50%; background: #111;">إنشاء</button>
  <button onclick="switchAuthTab('login')" id="loginTab" style="width: 50%; background: #666;">دخول</button>
</div>

<div id="signupForm">
  <input id="signupName" placeholder="الاسم الكامل">
  <input id="signupPhone" placeholder="الهاتف (10-12)">
  <input id="signupEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="signupPassword" type="password" placeholder="كلمة السر (6+)">
  <input id="signupPasswordConfirm" type="password" placeholder="تأكيد السر">
  <div style="margin: 1rem 0;">
    <label><input type="radio" name="role" value="راكب" checked> راكب</label>
    <label style="margin-right: 1rem;"><input type="radio" name="role" value="سائق"> سائق</label>
  </div>
  <button onclick="signup()">إنشاء الحساب</button>
  <p id="signupError" class="error"></p>
</div>

<div id="loginForm" style="display: none;">
  <input id="loginEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="loginPassword" type="password" placeholder="كلمة السر">
  <button onclick="login()">دخول</button>
  <p id="loginError" class="error"></p>
</div>
</div>

<!-- APP -->
<div id="appBox" style="display: none;">
<div class="container">
<div class="topbar">
  <div>
    <h3 id="userName" style="font-size: 18px;"></h3>
    <p id="locationStatus" class="status"></p>
  </div>
  <button onclick="logout()">خروج</button>
</div>

<!-- ============ PASSENGER ============ -->
<div id="passengerNav" style="display: none;">
<div class="tabs">
  <button class="tab-btn active" onclick="switchTabContent('pRides', this)">🚗 الرحلات</button>
  <button class="tab-btn" onclick="switchTabContent('pGroups', this)">👥 المجموعات</button>
</div>

<!-- Rides Page -->
<div id="pRides" class="page active">
<h3>الرحلات المتاحة</h3>
<div id="ridesList" class="empty">جاري التحميل...</div>
</div>

<!-- Groups List -->
<div id="pGroups" class="page">
<h3>مجموعات الجامعات</h3>
<div id="groupsList"></div>
</div>

<!-- Group Detail -->
<div id="pGroupDetail" class="page">
<button onclick="backToGroups()" style="margin-bottom: 1rem;">← رجوع</button>
<h3 id="groupTitle"></h3>
<div id="groupRequests"></div>
<hr style="border: 1px solid #666; margin: 1.5rem 0;">
<h4 style="color: #fff; margin-bottom: 1rem;">📝 إنشاء طلب رحلة</h4>
<input id="reqDay" type="date">
<input id="reqTime" type="time">
<input id="reqSeats" type="number" placeholder="عدد الركاب (3-7)" min="3" max="7" value="3">
<input id="reqBudget" type="number" placeholder="الميزانية الإجمالية">
<button onclick="createRequest()">إنشاء الطلب</button>
<p id="reqError" class="error" style="margin-top: 0.5rem;"></p>
</div>
</div>

<!-- ============ DRIVER ============ -->
<div id="driverNav" style="display: none;">
<div class="tabs">
  <button class="tab-btn active" onclick="switchTabContent('dCreate', this)">➕ إنشاء رحلة</button>
  <button class="tab-btn" onclick="switchTabContent('dMyRides', this)">🚗 رحلاتي</button>
  <button class="tab-btn" onclick="switchTabContent('dRequests', this)">📋 الطلبات</button>
</div>

<!-- Create -->
<div id="dCreate" class="page active">
<h3>إنشاء رحلة جديدة</h3>
<select id="dUniversity">
  <option value="">اختر الجامعة</option>
  <option>جامعة باجي مختار – سيدي عمار</option>
  <option>جامعة باجي مختار – البوني</option>
  <option>جامعة باجي مختار – سيدي عاشور</option>
  <option>كلية الطب – كوبا</option>
  <option>المدرسة العليا للتكنولوجيا – سيدي عمار</option>
  <option>المدرسة العليا لعلوم التسيير – عنابة</option>
  <option>المدرسة العليا للأساتذة – عنابة</option>
</select>
<input id="dDay" type="date">
<input id="dTime" type="time">
<input id="dSeats" type="number" placeholder="المقاعد (2-7)" min="2" max="7" value="3">
<input id="dPrice" type="number" placeholder="السعر الكلي">
<button onclick="createRide()" style="background: #27ae60; margin-top: 1rem;">إنشاء الرحلة</button>
<p id="dError" class="error" style="margin-top: 0.5rem;"></p>
</div>

<!-- My Rides -->
<div id="dMyRides" class="page">
<h3>رحلاتي</h3>
<div id="myRidesList" class="empty">لا توجد رحلات</div>
</div>

<!-- Requests -->
<div id="dRequests" class="page">
<h3>طلبات المجموعات</h3>
<div id="requestsList" class="empty">لا توجد طلبات قريبة</div>
</div>
</div>

</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0qYadPTlDwKiOmDUQlvzj0Dpm8tsLwMU",
  authDomain: "yahia-rideshare.firebaseapp.com",
  projectId: "yahia-rideshare",
  storageBucket: "yahia-rideshare.firebasestorage.app",
  messagingSenderId: "137329248871",
  appId: "1:137329248871:web:68968328e4b0eb59e3a2c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;
let currentRole = null;
let userLocation = { lat: 36.8865, lng: 7.7385 }; // عنابة default
let rides = [];
let requests = [];
let selectedGroupName = null;

const universities = {
  "جامعة باجي مختار – سيدي عمار": [36.879, 7.725],
  "جامعة باجي مختار – البوني": [36.871, 7.755],
  "جامعة باجي مختار – سيدي عاشور": [36.900, 7.780],
  "كلية الطب – كوبا": [36.902, 7.763],
  "المدرسة العليا للتكنولوجيا – سيدي عمار": [36.875, 7.720],
  "المدرسة العليا لعلوم التسيير – عنابة": [36.895, 7.740],
  "المدرسة العليا للأساتذة – عنابة": [36.890, 7.750]
};

function calcDist(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// ============ AUTH ============
function switchAuthTab(mode) {
    document.getElementById('signupForm').style.display = mode === 'signup' ? 'block' : 'none';
    document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('signupTab').style.background = mode === 'signup' ? '#111' : '#666';
    document.getElementById('loginTab').style.background = mode === 'login' ? '#111' : '#666';
}

async function signup() {
    const name = document.getElementById('signupName').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('signupPasswordConfirm').value;
    const role = document.querySelector('input[name="role"]:checked').value;
    
    const err = document.getElementById('signupError');
    err.textContent = '';

    if (!name || !phone || !email || !password || !confirmPassword) {
        err.textContent = '❌ أكمل جميع الحقول';
        return;
    }
    if (!/^\d{10,12}$/.test(phone)) {
        err.textContent = '❌ رقم صحيح (10-12 أرقام)';
        return;
    }
    if (password !== confirmPassword) {
        err.textContent = '❌ كلمات السر غير متطابقة';
        return;
    }
    if (password.length < 6) {
        err.textContent = '❌ كلمة السر: 6 أحرف على الأقل';
        return;
    }

    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        await db.collection('users').doc(user.uid).set({
            uid: user.uid,
            name: name,
            phone: phone,
            email: email,
            role: role,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        currentUser = { uid: user.uid, name: name, phone: phone };
        currentRole = role;
        getLocation();
    } catch (error) {
        err.textContent = '❌ ' + error.message;
    }
}

async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    const err = document.getElementById('loginError');
    err.textContent = '';

    if (!email || !password) {
        err.textContent = '❌ ادخل البريد وكلمة السر';
        return;
    }

    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        const userDoc = await db.collection('users').doc(user.uid).get();
        const userData = userDoc.data();

        currentUser = { uid: user.uid, name: userData.name, phone: userData.phone };
        currentRole = userData.role;
        getLocation();
    } catch (error) {
        err.textContent = '❌ ' + error.message;
    }
}

function getLocation() {
    document.getElementById('locationStatus').textContent = '⏳ جاري جلب الموقع...';
    
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                document.getElementById('locationStatus').textContent = `✅ موقعك جاهز`;
                enterApp();
            },
            error => {
                console.log('استخدام موقع افتراضي:', userLocation);
                document.getElementById('locationStatus').textContent = `⚠️ استخدام موقع افتراضي`;
                setTimeout(enterApp, 1000);
            },
            { enableHighAccuracy: false, timeout: 5000 }
        );
    } else {
        document.getElementById('locationStatus').textContent = `⚠️ لا يدعم الموقع`;
        enterApp();
    }
}

function enterApp() {
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('appBox').style.display = 'block';
    document.getElementById('userName').textContent = currentUser.name + ' (' + currentRole + ')';
    
    if (currentRole === 'راكب') {
        document.getElementById('passengerNav').style.display = 'block';
        document.getElementById('driverNav').style.display = 'none';
        renderGroupsList();
    } else {
        document.getElementById('passengerNav').style.display = 'none';
        document.getElementById('driverNav').style.display = 'block';
    }
    
    listenToRides();
    listenToRequests();
}

async function logout() {
    await auth.signOut();
    currentUser = null;
    currentRole = null;
    document.getElementById('authBox').style.display = 'block';
    document.getElementById('appBox').style.display = 'none';
}

auth.onAuthStateChanged(user => {
    if (user) {
        db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists) {
                const userData = doc.data();
                currentUser = { uid: user.uid, name: userData.name, phone: userData.phone };
                currentRole = userData.role;
                getLocation();
            }
        });
    }
});

// ============ RIDES ============
async function createRide() {
    const university = document.getElementById('dUniversity').value;
    const day = document.getElementById('dDay').value;
    const time = document.getElementById('dTime').value;
    const seats = parseInt(document.getElementById('dSeats').value);
    const price = parseInt(document.getElementById('dPrice').value);
    
    const err = document.getElementById('dError');
    err.textContent = '';

    if (!university || !day || !time || !seats || !price) {
        err.textContent = '❌ أكمل جميع الحقول';
        return;
    }

    const rideDateTime = new Date(`${day}T${time}`);
    if (rideDateTime < new Date()) {
        err.textContent = '❌ تاريخ ماضٍ';
        return;
    }

    try {
        const coords = universities[university];
        await db.collection('rides').add({
            driverUid: currentUser.uid,
            driver: currentUser.name,
            phone: currentUser.phone,
            university: university,
            day: day,
            time: time,
            rideTimestamp: firebase.firestore.Timestamp.fromDate(rideDateTime),
            totalSeats: seats,
            seatsLeft: seats,
            seatPrice: Math.round(price / seats),
            passengers: [],
            location: new firebase.firestore.GeoPoint(coords[0], coords[1]),
            status: 'active',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        err.textContent = '✅ رحلة منشورة بنجاح';
        document.getElementById('dUniversity').value = '';
        document.getElementById('dDay').value = '';
        document.getElementById('dTime').value = '';
        document.getElementById('dSeats').value = '3';
        document.getElementById('dPrice').value = '';
    } catch (error) {
        err.textContent = '❌ ' + error.message;
    }
}

function listenToRides() {
    const now = firebase.firestore.Timestamp.fromDate(new Date());
    db.collection('rides')
        .where('rideTimestamp', '>=', now)
        .where('status', '==', 'active')
        .orderBy('rideTimestamp')
        .onSnapshot(snapshot => {
            rides = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderRides();
            renderMyRides();
        });
}

function renderRides() {
    const container = document.getElementById('ridesList');
    container.innerHTML = '';
    
    let visible = rides.filter(r => {
        const dist = calcDist(userLocation.lat, userLocation.lng, r.location._lat, r.location._lng);
        return dist <= 1000 && r.seatsLeft > 0;
    });
    
    if (visible.length === 0) {
        container.innerHTML = '<div class="empty">لا توجد رحلات قريبة</div>';
        return;
    }
    
    visible.forEach(r => {
        const dist = calcDist(userLocation.lat, userLocation.lng, r.location._lat, r.location._lng);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <span class="badge">${r.seatsLeft}/${r.totalSeats}</span><br>
            <b>${r.university}</b><br>
            <b>الوقت:</b> ${r.day} ${r.time}<br>
            <b>السعر:</b> ${r.seatPrice} دج/المقعد<br>
            <b>السائق:</b> ${r.driver} (${r.phone})<br>
            <b>المسافة:</b> ${dist < 1000 ? Math.round(dist) + 'م' : (dist/1000).toFixed(1) + 'كم'}
        `;
        
        const btn = document.createElement('button');
        btn.textContent = 'احجز مقعد';
        btn.style.marginTop = '0.5rem';
        btn.onclick = () => bookRide(r.id);
        card.appendChild(btn);
        
        container.appendChild(card);
    });
}

async function bookRide(rideId) {
    try {
        const ref = db.collection('rides').doc(rideId);
        const doc = await ref.get();
        const r = doc.data();
        
        if (r.passengers.some(p => p.uid === currentUser.uid)) {
            alert('أنت حاجز بالفعل');
            return;
        }
        
        if (r.seatsLeft <= 0) {
            alert('ما فيه مقاعد');
            return;
        }
        
        await ref.update({
            passengers: firebase.firestore.FieldValue.arrayUnion({
                uid: currentUser.uid,
                name: currentUser.name,
                phone: currentUser.phone
            }),
            seatsLeft: r.seatsLeft - 1
        });
        
        alert('✅ تم الحجز بنجاح');
    } catch (error) {
        alert('❌ ' + error.message);
    }
}

function renderMyRides() {
    const container = document.getElementById('myRidesList');
    container.innerHTML = '';
    
    const myRides = rides.filter(r => r.driverUid === currentUser.uid);
    
    if (myRides.length === 0) {
        container.innerHTML = '<div class="empty">لا توجد رحلات</div>';
        return;
    }
    
    myRides.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <span class="badge">${r.seatsLeft}/${r.totalSeats}</span><br>
            <b>${r.university}</b> | ${r.day} ${r.time}<br>
            <b>السعر:</b> ${r.seatPrice} دج/المقعد<br>
            <b>الركاب:</b> ${r.passengers.map(p => p.name + ' (' + p.phone + ')').join(', ') || 'لا أحد بعد'}
        `;
        container.appendChild(card);
    });
}

// ============ GROUPS & REQUESTS ============
function renderGroupsList() {
    const container = document.getElementById('groupsList');
    container.innerHTML = '';
    
    Object.keys(universities).forEach(uni => {
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        btn.textContent = '👥 ' + uni;
        btn.onclick = () => openGroup(uni);
        container.appendChild(btn);
    });
}

function openGroup(university) {
    selectedGroupName = university;
    document.getElementById('pGroups').classList.remove('active');
    document.getElementById('pGroupDetail').classList.add('active');
    document.getElementById('groupTitle').textContent = university;
    renderGroupRequests();
}

function backToGroups() {
    selectedGroupName = null;
    document.getElementById('pGroupDetail').classList.remove('active');
    document.getElementById('pGroups').classList.add('active');
}

function renderGroupRequests() {
    const container = document.getElementById('groupRequests');
    container.innerHTML = '';
    
    const groupReqs = requests.filter(r => r.university === selectedGroupName);
    
    if (groupReqs.length === 0) {
        container.innerHTML = '<p class="status">لا توجد طلبات في هذه المجموعة</p>';
        return;
    }
    
    groupReqs.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <span class="badge">${r.members.length}/${r.seatsNeeded}</span><br>
            <b>من:</b> ${r.organizer}<br>
            <b>الوقت:</b> ${r.day} ${r.time}<br>
            <b>الميزانية:</b> ${r.budget} دج
        `;
        
        const isJoined = r.members.some(m => m.uid === currentUser.uid);
        
        if (isJoined) {
            const span = document.createElement('span');
            span.textContent = ' ✅ منضم';
            span.style.color = '#27ae60';
            span.style.marginLeft = '0.5rem';
            card.appendChild(span);
        } else if (r.members.length < r.seatsNeeded) {
            const btn = document.createElement('button');
            btn.textContent = 'انضم للمجموعة';
            btn.style.marginTop = '0.5rem';
            btn.onclick = () => joinRequest(r.id);
            card.appendChild(btn);
        }
        
        container.appendChild(card);
    });
}

async function createRequest() {
    const day = document.getElementById('reqDay').value;
    const time = document.getElementById('reqTime').value;
    const seats = parseInt(document.getElementById('reqSeats').value);
    const budget = parseInt(document.getElementById('reqBudget').value);
    
    const err = document.getElementById('reqError');
    err.textContent = '';

    if (!day || !time || !seats || !budget) {
        err.textContent = '❌ أكمل جميع الحقول';
        return;
    }
    
    try {
        const coords = universities[selectedGroupName];
        await db.collection('requests').add({
            university: selectedGroupName,
            organizer: currentUser.name,
            phone: currentUser.phone,
            organizerUid: currentUser.uid,
            day: day,
            time: time,
            seatsNeeded: seats,
            budget: budget,
            requestTimestamp: firebase.firestore.Timestamp.fromDate(new Date(`${day}T${time}`)),
            members: [{ uid: currentUser.uid, name: currentUser.name, phone: currentUser.phone }],
            location: new firebase.firestore.GeoPoint(coords[0], coords[1]),
            status: 'waiting',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        err.textContent = '✅ طلب منشور بنجاح';
        document.getElementById('reqDay').value = '';
        document.getElementById('reqTime').value = '';
        document.getElementById('reqSeats').value = '3';
        document.getElementById('reqBudget').value = '';
    } catch (error) {
        err.textContent = '❌ ' + error.message;
    }
}

async function joinRequest(requestId) {
    try {
        const ref = db.collection('requests').doc(requestId);
        const doc = await ref.get();
        const r = doc.data();
        
        if (r.members.some(m => m.uid === currentUser.uid)) {
            alert('أنت منضم بالفعل');
            return;
        }
        
        if (r.members.length >= r.seatsNeeded) {
            alert('المجموعة امتلأت');
            return;
        }
        
        await ref.update({
            members: firebase.firestore.FieldValue.arrayUnion({
                uid: currentUser.uid,
                name: currentUser.name,
                phone: currentUser.phone
            })
        });
        
        alert('✅ تم الانضمام');
        renderGroupRequests();
    } catch (error) {
        alert('❌ ' + error.message);
    }
}

function listenToRequests() {
    db.collection('requests').onSnapshot(snapshot => {
        requests = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        if (currentRole === 'راكب' && selectedGroupName) {
            renderGroupRequests();
        } else if (currentRole === 'سائق') {
            renderDriverRequests();
        }
    });
}

function renderDriverRequests() {
    const container = document.getElementById('requestsList');
    container.innerHTML = '';
    
    let visible = requests.filter(r => {
        const dist = calcDist(userLocation.lat, userLocation.lng, r.location._lat, r.location._lng);
        return dist <= 1000 && r.status === 'waiting';
    });
    
    if (visible.length === 0) {
        container.innerHTML = '<div class="empty">لا توجد طلبات قريبة</div>';
        return;
    }
    
    visible.forEach(r => {
        const dist = calcDist(userLocation.lat, userLocation.lng, r.location._lat, r.location._lng);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <span class="badge">${r.members.length}/${r.seatsNeeded}</span><br>
            <b>${r.university}</b><br>
            <b>المنظم:</b> ${r.organizer} (${r.phone})<br>
            <b>الوقت:</b> ${r.day} ${r.time}<br>
            <b>الميزانية:</b> ${r.budget} دج<br>
            <b>المسافة:</b> ${dist < 1000 ? Math.round(dist) + 'م' : (dist/1000).toFixed(1) + 'كم'}
        `;
        
        const btn = document.createElement('button');
        btn.textContent = 'قبول المجموعة';
        btn.style.background = '#27ae60';
        btn.style.marginTop = '0.5rem';
        btn.onclick = () => acceptRequest(r.id, r.seatsNeeded);
        card.appendChild(btn);
        
        container.appendChild(card);
    });
}

async function acceptRequest(requestId, seatsNeeded) {
    const seats = prompt(`كم مقعد عندك؟ (المطلوب ${seatsNeeded})`);
    if (!seats || parseInt(seats) < seatsNeeded) {
        alert('عدد غير كافٍ');
        return;
    }
    
    try {
        await db.collection('requests').doc(requestId).update({
            driverUid: currentUser.uid,
            driver: currentUser.name,
            driverPhone: currentUser.phone,
            seatsAvailable: parseInt(seats),
            status: 'accepted'
        });
        
        alert('✅ قبلت المجموعة');
    } catch (error) {
        alert('❌ ' + error.message);
    }
}

// ============ TAB SWITCHING ============
function switchTabContent(pageId, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}
</script>
