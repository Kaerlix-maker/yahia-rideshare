<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yahia RideShare - المجموعات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
<style>
body {
    font-family:'Cairo',sans-serif;
    margin:0;
    direction:rtl;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    min-height:100vh;
}
header {
    background:#000000;
    color:white;
    padding:1rem;
    text-align:center;
}
.container {
    max-width: 750px;
    margin: 2rem auto;
    padding: 2rem;
    border-radius: 15px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
    color: #fff;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}
input, select, button {
    width:100%;
    padding:0.8rem;
    margin:0.5rem 0;
    border-radius:7px;
    border:1px solid #ccc;
    font-family:'Cairo',sans-serif;
    box-sizing:border-box;
}
button {
    background:#111;
    color:#fff;
    border:none;
    font-weight:bold;
    cursor:pointer;
    transition:background .2s;
}
button:hover { background:#333; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.request {
    border:1px solid #ddd;
    padding:1rem;
    margin:1rem 0;
    border-radius:12px;
    background:rgba(255,255,255,0.95);
    color:#111;
}
.badge {
    display:inline-block;
    background:#e8f5e9;
    color:#2e7d32;
    padding:0.3rem 0.6rem;
    border-radius:5px;
    font-size:0.8rem;
    margin-bottom:0.5rem;
}
.topbar { display:flex; justify-content:space-between; align-items:center; }
.topbar button { width:auto; padding:0.5rem 1rem; margin:0; }
.status { text-align:center; padding:1rem; opacity:0.7; font-size:0.9rem; }
</style>
</head>
<body>
<header>
<h1>Yahia RideShare - المجموعات</h1>
<h2>انظم مجموعتك أو اسأل عن رحلة</h2>
</header>

<!-- نافذة التسجيل -->
<div class="container" id="authDiv">
<div style="display: flex; gap: 10px; margin-bottom: 1.5rem;">
  <button onclick="toggleAuthMode('signup')" id="signupBtn" style="flex: 1; background: #111;">إنشاء حساب</button>
  <button onclick="toggleAuthMode('login')" id="loginBtn" style="flex: 1; background: #666;">دخول</button>
</div>

<div id="signupForm">
  <input id="signupName" placeholder="الاسم الكامل">
  <input id="signupPhone" placeholder="رقم الهاتف (10-12 رقم)">
  <input id="signupEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="signupPassword" type="password" placeholder="كلمة السر (6 أحرف على الأقل)">
  <input id="signupPasswordConfirm" type="password" placeholder="تأكيد كلمة السر">
  <div style="margin: 1rem 0;">
    <label style="display: block; margin-bottom: 0.5rem;">
      <input type="radio" name="role" value="سائق" checked> أنا سائق
    </label>
    <label>
      <input type="radio" name="role" value="راكب"> أنا راكب
    </label>
  </div>
  <button onclick="handleSignUp()">إنشاء الحساب</button>
  <p id="signupError" style="color: #e74c3c; font-size: 12px; margin-top: 0.5rem;"></p>
</div>

<div id="loginForm" style="display: none;">
  <input id="loginEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="loginPassword" type="password" placeholder="كلمة السر">
  <button onclick="handleLogin()">دخول</button>
  <p id="loginError" style="color: #e74c3c; font-size: 12px; margin-top: 0.5rem;"></p>
</div>
</div>

<!-- التطبيق الرئيسي -->
<div class="container" id="appDiv" style="display:none">
<div class="topbar">
  <h3>مرحباً <span id="userName"></span> - <span id="userRole"></span></h3>
  <button onclick="logout()">خروج</button>
</div>

<!-- قسم الراكب: طلب رحلة -->
<div id="passengerSection" style="display:none">
<h4>🆕 أطلب رحلة مجموعية</h4>
<input id="reqName" placeholder="اسم المجموعة (اختياري)">
<select id="reqUniversity">
  <option value="">اختر الجامعة</option>
  <option>جامعة باجي مختار – سيدي عمار</option>
  <option>جامعة باجي مختار – البوني</option>
  <option>جامعة باجي مختار – سيدي عاشور</option>
  <option>كلية الطب – كوبا</option>
  <option>المدرسة العليا للتكنولوجيا – سيدي عمار</option>
  <option>المدرسة العليا لعلوم التسيير – عنابة</option>
  <option>المدرسة العليا للأساتذة – عنابة</option>
</select>
<input type="date" id="reqDay">
<input type="time" id="reqTime">
<input type="number" id="reqSeats" placeholder="عدد المقاعد المطلوبة (3-7)" min="3" max="7" value="3">
<button onclick="getLocationForRequest()">📍 جلب موقعي</button>
<p id="locationStatus" style="font-size: 12px; opacity: 0.8;"></p>
<button onclick="createRideRequest()">إنشاء طلب رحلة</button>
</div>

<!-- قسم السائق: قبول المجموعات -->
<div id="driverSection" style="display:none">
<h4>🚗 قبول مجموعات</h4>
<p style="opacity: 0.8;">اختر مجموعة واقبل الرحلة:</p>
</div>

<!-- المجموعات المتاحة -->
<h3>المجموعات المتاحة</h3>
<div id="ridesStatus" class="status" style="display:none">جارِ تحميل المجموعات...</div>
<div id="requestsList"></div>
</div>

<!-- Firebase & Leaflet -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0qYadPTlDwKiOmDUQlvzj0Dpm8tsLwMU",
  authDomain: "yahia-rideshare.firebaseapp.com",
  projectId: "yahia-rideshare",
  storageBucket: "yahia-rideshare.firebasestorage.app",
  messagingSenderId: "137329248871",
  appId: "1:137329248871:web:68968328e4b0eb59e3a2c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser, currentRole;
let rideRequests = [];
let unsubscribeRequests = null;
let userLocation = null;

const requestsList = document.getElementById('requestsList');
const driverSection = document.getElementById('driverSection');
const passengerSection = document.getElementById('passengerSection');
const ridesStatus = document.getElementById('ridesStatus');

const universities = {
  "جامعة باجي مختار – سيدي عمار": [36.879, 7.725],
  "جامعة باجي مختار – البوني": [36.871, 7.755],
  "جامعة باجي مختار – سيدي عاشور": [36.900, 7.780],
  "كلية الطب – كوبا": [36.902, 7.763],
  "المدرسة العليا للتكنولوجيا – سيدي عمار": [36.875, 7.720],
  "المدرسة العليا لعلوم التسيير – عنابة": [36.895, 7.740],
  "المدرسة العليا للأساتذة – عنابة": [36.890, 7.750]
};

// ============ AUTH ============
function toggleAuthMode(mode) {
    document.getElementById('signupForm').style.display = mode === 'signup' ? 'block' : 'none';
    document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('signupBtn').style.background = mode === 'signup' ? '#111' : '#666';
    document.getElementById('loginBtn').style.background = mode === 'login' ? '#111' : '#666';
}

async function handleSignUp() {
    const name = document.getElementById('signupName').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('signupPasswordConfirm').value;
    const role = document.querySelector('input[name="role"]:checked').value;
    
    const errorEl = document.getElementById('signupError');
    errorEl.textContent = '';

    if (!name || !phone || !email || !password || !confirmPassword) {
        errorEl.textContent = 'أكمل جميع الحقول';
        return;
    }

    if (!/^\d{10,12}$/.test(phone)) {
        errorEl.textContent = 'رقم الهاتف يجب أن يكون 10-12 أرقام';
        return;
    }

    if (password !== confirmPassword) {
        errorEl.textContent = 'كلمة السر غير متطابقة';
        return;
    }

    if (password.length < 6) {
        errorEl.textContent = 'كلمة السر يجب أن تكون 6 أحرف على الأقل';
        return;
    }

    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        await db.collection('users').doc(user.uid).set({
            uid: user.uid,
            name: name,
            phone: phone,
            email: email,
            role: role,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        currentUser = { uid: user.uid, name: name, phone: phone, email: email };
        currentRole = role;
        
        document.getElementById('authDiv').style.display = 'none';
        document.getElementById('appDiv').style.display = 'block';
        document.getElementById('userName').textContent = name;
        document.getElementById('userRole').textContent = role;
        
        if (role === 'سائق') driverSection.style.display = 'block';
        else passengerSection.style.display = 'block';
        
        listenToRequests();
    } catch (error) {
        errorEl.textContent = 'خطأ: ' + error.message;
    }
}

async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';

    if (!email || !password) {
        errorEl.textContent = 'أدخل البريد الإلكتروني وكلمة السر';
        return;
    }

    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        const userDoc = await db.collection('users').doc(user.uid).get();
        const userData = userDoc.data();

        currentUser = { uid: user.uid, name: userData.name, phone: userData.phone, email: userData.email };
        currentRole = userData.role;
        
        document.getElementById('authDiv').style.display = 'none';
        document.getElementById('appDiv').style.display = 'block';
        document.getElementById('userName').textContent = userData.name;
        document.getElementById('userRole').textContent = userData.role;
        
        if (userData.role === 'سائق') driverSection.style.display = 'block';
        else passengerSection.style.display = 'block';
        
        listenToRequests();
    } catch (error) {
        errorEl.textContent = 'خطأ: ' + error.message;
    }
}

async function logout(){
    await auth.signOut();
    currentUser = null;
    currentRole = null;
    
    document.getElementById('appDiv').style.display = 'none';
    document.getElementById('authDiv').style.display = 'block';
    
    if (unsubscribeRequests) unsubscribeRequests();
    requestsList.innerHTML = '';
}

auth.onAuthStateChanged(user => {
    if (user) {
        db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists) {
                const userData = doc.data();
                currentUser = { uid: user.uid, name: userData.name, phone: userData.phone, email: userData.email };
                currentRole = userData.role;
                
                document.getElementById('authDiv').style.display = 'none';
                document.getElementById('appDiv').style.display = 'block';
                document.getElementById('userName').textContent = userData.name;
                document.getElementById('userRole').textContent = userData.role;
                
                if (userData.role === 'سائق') driverSection.style.display = 'block';
                else passengerSection.style.display = 'block';
                
                listenToRequests();
            }
        });
    } else {
        document.getElementById('authDiv').style.display = 'block';
        document.getElementById('appDiv').style.display = 'none';
    }
});

// ============ LOCATION ============
function getLocationForRequest() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                document.getElementById('locationStatus').textContent = '✅ تم جلب الموقع';
            },
            error => {
                alert('خطأ في جلب الموقع: ' + error.message);
            }
        );
    } else {
        alert('متصفحك لا يدعم الموقع الجغرافي');
    }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// ============ RIDE REQUESTS ============
async function createRideRequest() {
    const name = document.getElementById('reqName').value.trim() || 'بدون اسم';
    const university = document.getElementById('reqUniversity').value;
    const day = document.getElementById('reqDay').value;
    const time = document.getElementById('reqTime').value;
    const seats = parseInt(document.getElementById('reqSeats').value);
    
    if (!university || !day || !time) {
        alert('أكمل جميع الحقول');
        return;
    }

    if (!userLocation) {
        alert('جلب موقعك أولاً');
        return;
    }

    const rideDateTime = new Date(`${day}T${time}`);
    if (rideDateTime < new Date()) {
        alert('لا يمكن إنشاء طلب بتاريخ ماضٍ');
        return;
    }

    try {
        await db.collection('ride_requests').add({
            organizerUid: currentUser.uid,
            organizer: currentUser.name,
            phone: currentUser.phone,
            name: name,
            university: university,
            day: day,
            time: time,
            rideTimestamp: firebase.firestore.Timestamp.fromDate(rideDateTime),
            seatsNeeded: seats,
            members: [{ uid: currentUser.uid, name: currentUser.name, phone: currentUser.phone }],
            location: new firebase.firestore.GeoPoint(userLocation.lat, userLocation.lng),
            status: 'waiting',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        alert('تم إنشاء الطلب بنجاح');
        document.getElementById('reqName').value = '';
        document.getElementById('reqUniversity').value = '';
        document.getElementById('reqDay').value = '';
        document.getElementById('reqTime').value = '';
        document.getElementById('reqSeats').value = '3';
        document.getElementById('locationStatus').textContent = '';
    } catch (error) {
        alert('خطأ: ' + error.message);
    }
}

async function joinRequest(requestId) {
    try {
        const reqRef = db.collection('ride_requests').doc(requestId);
        const reqDoc = await reqRef.get();
        const req = reqDoc.data();

        if (req.members.some(m => m.uid === currentUser.uid)) {
            alert('أنت بالفعل في هذه المجموعة');
            return;
        }

        if (req.members.length >= req.seatsNeeded) {
            alert('المجموعة امتلأت');
            return;
        }

        await reqRef.update({
            members: firebase.firestore.FieldValue.arrayUnion({
                uid: currentUser.uid,
                name: currentUser.name,
                phone: currentUser.phone
            })
        });
    } catch (error) {
        alert('خطأ: ' + error.message);
    }
}

async function acceptRequest(requestId, seatsNeeded) {
    const seatsAvailable = parseInt(prompt(`كم مقعد عندك؟ (المطلوب ${seatsNeeded})`));
    
    if (!seatsAvailable || seatsAvailable < seatsNeeded) {
        alert('عدد المقاعد غير كافي');
        return;
    }

    try {
        await db.collection('ride_requests').doc(requestId).update({
            status: 'accepted',
            driverUid: currentUser.uid,
            driver: currentUser.name,
            driverPhone: currentUser.phone,
            seatsAvailable: seatsAvailable
        });
    } catch (error) {
        alert('خطأ: ' + error.message);
    }
}

function listenToRequests() {
    ridesStatus.style.display = 'block';

    const now = firebase.firestore.Timestamp.fromDate(new Date());
    let query = db.collection('ride_requests').where('rideTimestamp', '>=', now).orderBy('rideTimestamp');

    unsubscribeRequests = query.onSnapshot(snapshot => {
        ridesStatus.style.display = 'none';
        rideRequests = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderRequests();
    });
}

function renderRequests() {
    requestsList.innerHTML = '';

    let visibleRequests = rideRequests.filter(r => {
        if (currentRole === 'سائق') return r.status === 'waiting';
        if (currentRole === 'راكب' && userLocation) {
            const distance = calculateDistance(
                userLocation.lat, userLocation.lng,
                r.location._lat, r.location._lng
            );
            return distance <= 1000; // 1 كم
        }
        return true;
    });

    if (visibleRequests.length === 0) {
        requestsList.innerHTML = '<p class="status">لا توجد مجموعات متاحة</p>';
        return;
    }

    visibleRequests.forEach(r => {
        const div = document.createElement('div');
        div.className = 'request';
        
        const distance = userLocation ? 
            calculateDistance(userLocation.lat, userLocation.lng, r.location._lat, r.location._lng)
            : 0;
        const distanceText = userLocation ? 
            `<br><b>المسافة:</b> ${distance < 1000 ? Math.round(distance) + ' م' : (distance/1000).toFixed(1) + ' كم'}`
            : '';

        div.innerHTML = `
            <div class="badge">${r.members.length}/${r.seatsNeeded}</div>
            <b>${r.name}</b><br>
            <b>الجامعة:</b> ${r.university}<br>
            <b>الوقت:</b> ${r.day} ${r.time}<br>
            <b>المنظم:</b> ${r.organizer}<br>
            <b>رقم:</b> ${r.phone}
            ${distanceText}
        `;

        if (currentRole === 'راكب' && r.members.length < r.seatsNeeded) {
            const btn = document.createElement('button');
            btn.textContent = 'انضم للمجموعة';
            btn.onclick = () => joinRequest(r.id);
            div.appendChild(btn);
        }

        if (currentRole === 'سائق' && r.status === 'waiting') {
            const btn = document.createElement('button');
            btn.textContent = 'قبول المجموعة 🚗';
            btn.style.background = '#27ae60';
            btn.onclick = () => acceptRequest(r.id, r.seatsNeeded);
            div.appendChild(btn);
        }

        if (r.status === 'accepted') {
            const accepted = document.createElement('div');
            accepted.style.background = '#d4edda';
            accepted.style.color = '#155724';
            accepted.style.padding = '0.5rem';
            accepted.style.borderRadius = '5px';
            accepted.style.marginTop = '0.5rem';
            accepted.innerHTML = `
                ✅ قبلها <b>${r.driver}</b><br>
                مقاعد: ${r.seatsAvailable} | هاتف: ${r.driverPhone}
            `;
            div.appendChild(accepted);
        }

        requestsList.appendChild(div);
    });
}
</script>
</body>
</html>
