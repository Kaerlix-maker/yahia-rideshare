<script>

      Project settings > General > Your apps > SDK setup and configuration
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyA0qYadPTlDwKiOmDUQlvzj0Dpm8tsLwMU",

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// كل مستخدم يدخل بدون حساب (anonymous auth) باش نقدر نربط
// كل رحلة/حجز بمعرف فريد وآمن (uid) بدل نعتمد غير على الاسم
let currentUid = null;



/* =========================================================
   2) STATE
   ========================================================= */
let currentUser, currentRole;
let rides = [];              // نسخة محلية محدثة تلقائياً من Firestore
let unsubscribeRides = null; // للتوقف عن الاستماع عند logout
let selectedPoint = null;
let userLocation = null;     // موقع المستخدم الحالي
let selectedDistance = 100;  // المسافة المختارة (متر) - افتراضياً 100م
let isLoadingLocation = false; // للتحقق من جلب الموقع

const nameInput = document.getElementById('name');
const phoneInput = document.getElementById('phone');
const directionInput = document.getElementById('direction');
const fromInput = document.getElementById('from');
const toInput = document.getElementById('to');
const dayInput = document.getElementById('day');
const timeInput = document.getElementById('time');
const seatsInput = document.getElementById('seats');
const priceInput = document.getElementById('price');
const ridesList = document.getElementById('ridesList');
const ridesStatus = document.getElementById('ridesStatus');
const driverSection = document.getElementById('driverSection');
const authStatus = document.getElementById('authStatus');
const addRideBtn = document.getElementById('addRideBtn');

const universityCoords = {
"جامعة باجي مختار – سيدي عمار":[36.879,7.725],
"جامعة باجي مختار – البوني":[36.871,7.755],
"جامعة باجي مختار – سيدي عاشور":[36.900,7.780],
"كلية الطب – كوبا":[36.902,7.763],
"المدرسة العليا للتكنولوجيا – سيدي عمار":[36.875,7.720],
"المدرسة العليا لعلوم التسيير – عنابة":[36.895,7.740],
"المدرسة العليا للأساتذة – عنابة":[36.890,7.750]
};

/* =========================================================
   3) AUTH - دخول مجهول تلقائي عند فتح الصفحة
   ========================================================= */
/* =========================================================
   AUTH SYSTEM - Email/Password
   ========================================================= */

function toggleAuthMode(mode) {
    if (mode === 'signup') {
        document.getElementById('signupForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('signupBtn').style.background = '#111';
        document.getElementById('loginBtn').style.background = '#666';
    } else {
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('loginBtn').style.background = '#111';
        document.getElementById('signupBtn').style.background = '#666';
    }
}

async function handleSignUp() {
    const name = document.getElementById('signupName').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('signupPasswordConfirm').value;
    const role = document.querySelector('input[name="role"]:checked').value;
    
    const errorEl = document.getElementById('signupError');
    errorEl.textContent = '';

    if (!name || !phone || !email || !password || !confirmPassword) {
        errorEl.textContent = 'أكمل جميع الحقول';
        return;
    }

    if (!/^\d{10,12}$/.test(phone)) {
        errorEl.textContent = 'رقم الهاتف يجب أن يكون 10-12 أرقام';
        return;
    }

    if (password !== confirmPassword) {
        errorEl.textContent = 'كلمة السر غير متطابقة';
        return;
    }

    if (password.length < 6) {
        errorEl.textContent = 'كلمة السر يجب أن تكون 6 أحرف على الأقل';
        return;
    }

    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        await db.collection('users').doc(user.uid).set({
            uid: user.uid,
            name: name,
            phone: phone,
            email: email,
            role: role,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        currentUser = { uid: user.uid, name: name, phone: phone, email: email };
        currentRole = role;
        
        document.getElementById('authDiv').style.display = 'none';
        document.getElementById('appDiv').style.display = 'block';
        document.getElementById('userName').textContent = name;
        document.getElementById('userRole').textContent = role;
        
        if (role === 'سائق') driverSection.style.display = 'block';
        
        listenToRides();
    } catch (error) {
        errorEl.textContent = 'خطأ: ' + error.message;
    }
}

async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';

    if (!email || !password) {
        errorEl.textContent = 'أدخل البريد الإلكتروني وكلمة السر';
        return;
    }

    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        const userDoc = await db.collection('users').doc(user.uid).get();
        const userData = userDoc.data();

        currentUser = { uid: user.uid, name: userData.name, phone: userData.phone, email: userData.email };
        currentRole = userData.role;
        
        document.getElementById('authDiv').style.display = 'none';
        document.getElementById('appDiv').style.display = 'block';
        document.getElementById('userName').textContent = userData.name;
        document.getElementById('userRole').textContent = userData.role;
        
        if (userData.role === 'سائق') driverSection.style.display = 'block';
        
        listenToRides();
    } catch (error) {
        errorEl.textContent = 'خطأ: ' + error.message;
    }
}

auth.onAuthStateChanged(user => {
    if (user) {
        db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists) {
                const userData = doc.data();
                currentUser = { uid: user.uid, name: userData.name, phone: userData.phone, email: userData.email };
                currentRole = userData.role;
                
                document.getElementById('authDiv').style.display = 'none';
                document.getElementById('appDiv').style.display = 'block';
                document.getElementById('userName').textContent = userData.name;
                document.getElementById('userRole').textContent = userData.role;
                
                if (userData.role === 'سائق') driverSection.style.display = 'block';
                
                listenToRides();
            }
        });
    } else {
        document.getElementById('authDiv').style.display = 'block';
        document.getElementById('appDiv').style.display = 'none';
    }
});

/* =========================================================
   4) MAP SELECTOR
   ========================================================= */
const mapSelector = L.map('mapSelector').setView([36.89,7.75],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(mapSelector);
let marker = null;

mapSelector.on('click', async e => {
    selectedPoint = [e.latlng.lat, e.latlng.lng];
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${selectedPoint[0]}&lon=${selectedPoint[1]}`);
        const data = await res.json();
        fromInput.value = data.display_name || "موقع مختار";
    } catch (err) {
        fromInput.value = "موقع مختار";
    }
    if (marker) mapSelector.removeLayer(marker);
    marker = L.marker(selectedPoint).addTo(mapSelector).bindPopup('نقطة الانطلاق').openPopup();
});

/* =========================================================
   LOCATION AND DISTANCE FUNCTIONS
   ========================================================= */

// حساب المسافة بين نقطتين (بالمتر)
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000; // نصف قطر الأرض بالمتر
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c; // المسافة بالمتر
}

// جلب موقع المستخدم الحالي
function getLocation() {
    isLoadingLocation = true;
    
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                isLoadingLocation = false;
                renderRides();  // تحديث الرحلات
                alert('تم جلب الموقع بنجاح');
            },
            error => {
                isLoadingLocation = false;
                alert('خطأ في جلب الموقع: ' + error.message);
            }
        );
    } else {
        alert('متصفحك لا يدعم الموقع الجغرافي');
        isLoadingLocation = false;
    }
}

// تبديل المسافة المختارة
function setDistance(distance) {
    selectedDistance = distance;
    
    // تحديث أزرار الفلتر
    document.getElementById('dist10').style.background = distance === 10 ? '#111' : '#666';
    document.getElementById('dist50').style.background = distance === 50 ? '#111' : '#666';
    document.getElementById('dist100').style.background = distance === 100 ? '#111' : '#666';
    document.getElementById('dist1000').style.background = distance === 1000 ? '#111' : '#666';
    
    renderRides();  // إعادة عرض الرحلات
}

function toggleMap(){
    const m = document.getElementById('mapSelector');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
    if (m.style.display === 'block') setTimeout(() => mapSelector.invalidateSize(), 200);
}

/* =========================================================
   LOGOUT FUNCTION
   ========================================================= */
async function logout(){
    await auth.signOut();
    currentUser = null;
    currentRole = null;
    
    document.getElementById('appDiv').style.display = 'none';
    document.getElementById('authDiv').style.display = 'block';
    
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('signupName').value = '';
    document.getElementById('signupPhone').value = '';
    document.getElementById('signupEmail').value = '';
    document.getElementById('signupPassword').value = '';
    document.getElementById('signupPasswordConfirm').value = '';
    
    if (unsubscribeRides) unsubscribeRides();
    ridesList.innerHTML = '';
}

/* =========================================================
   6) FIRESTORE: إضافة رحلة
   ========================================================= */
async function addRide(){
    const direction = directionInput.value;
    const from = fromInput.value.trim();
    const to = toInput.value;
    const day = dayInput.value;
    const time = timeInput.value;
    const seats = parseInt(seatsInput.value);
    const price = parseInt(priceInput.value);

    if (!from || !to || !day || !time || !price) return alert('أكمل الحقول');

    // الرحلة لازم تكون فـ المستقبل
    const rideDateTime = new Date(`${day}T${time}`);
    if (rideDateTime < new Date()) return alert('لا يمكن إضافة رحلة بتاريخ ماضٍ');

    let fromCoords, toCoords;
    if (direction === 'to_university'){
        fromCoords = selectedPoint || [36.89,7.75];
        toCoords = universityCoords[to];
    } else {
        fromCoords = universityCoords[to];
        toCoords = selectedPoint || [36.89,7.75];
    }

    const ride = {
        driverUid: currentUser.uid,
        driver: currentUser.name,
        phone: currentUser.phone,
        direction,
        from: direction === 'to_university' ? from : to,
        to: direction === 'to_university' ? to : from,
        day,
        time,
        rideTimestamp: firebase.firestore.Timestamp.fromDate(rideDateTime),
        seats,
        seatPrice: Math.round(price / seats),
        passengers: [],
        fromCoords,
        toCoords,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    addRideBtn.disabled = true;
    try {
        await db.collection('rides').add(ride);
        alert('تمت إضافة الرحلة');
        fromInput.value = ''; priceInput.value = '';
    } catch (err) {
        alert('خطأ أثناء إضافة الرحلة: ' + err.message);
    } finally {
        addRideBtn.disabled = false;
    }
}

/* =========================================================
   7) FIRESTORE: حجز مقعد
   نستعمل transaction باش نتفادى تعارض حجزين فنفس اللحظة (race condition)
   ========================================================= */
async function bookRide(rideId){
    const rideRef = db.collection('rides').doc(rideId);
    try {
        await db.runTransaction(async (t) => {
            const doc = await t.get(rideRef);
            if (!doc.exists) throw new Error('الرحلة لم تعد متاحة');
            const r = doc.data();

            if (r.passengers.some(p => p.uid === currentUser.uid)) {
                throw new Error('لقد حجزت هذه الرحلة مسبقاً');
            }
            if (r.passengers.length >= r.seats) {
                throw new Error('لا مقاعد متبقية');
            }
            const updatedPassengers = [...r.passengers, {
                uid: currentUser.uid, name: currentUser.name, phone: currentUser.phone
            }];
            t.update(rideRef, {passengers: updatedPassengers});
        });
    } catch (err) {
        alert(err.message);
    }
}

async function deleteRide(rideId){
    if (!confirm('هل تريد حذف هذه الرحلة؟')) return;
    try {
        await db.collection('rides').doc(rideId).delete();
    } catch (err) {
        alert('خطأ أثناء الحذف: ' + err.message);
    }
}

/* =========================================================
   8) الاستماع للرحلات في الوقت الحقيقي (real-time)
   بدل ما نقرا مرة وحدة من localStorage، هنا كل تغيير
   (رحلة جديدة، حجز، حذف) يوصل تلقائياً لكل المستخدمين.
   ========================================================= */
function listenToRides(){
    ridesStatus.style.display = 'block';

    const now = firebase.firestore.Timestamp.fromDate(new Date());
    let query = db.collection('rides').where('rideTimestamp', '>=', now).orderBy('rideTimestamp');

    if (currentRole === 'سائق') {
        query = query.where('driverUid', '==', currentUser.uid);
    }

    unsubscribeRides = query.onSnapshot(snapshot => {
        ridesStatus.style.display = 'none';
        rides = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
        renderRides();
    }, err => {
        ridesStatus.textContent = 'خطأ أثناء تحميل الرحلات: ' + err.message;
    });
}

/* =========================================================
   9) العرض
   ========================================================= */
function renderRides(){
    ridesList.innerHTML = '';
    
    // إظهار قسم الفلتر للراكب فقط
    if (currentRole === 'راكب') {
        document.getElementById('filterSection').style.display = 'block';
    } else {
        document.getElementById('filterSection').style.display = 'none';
    }

    let visibleRides = rides.filter((r) => {
        if(currentRole === 'سائق'){
            return r.driverUid === currentUser.uid;
        }
        return true;
    });
    
    // تطبيق فلتر المسافة للراكب
    if (currentRole === 'راكب' && userLocation) {
        visibleRides = visibleRides.filter((r) => {
            const distance = calculateDistance(
                userLocation.lat, 
                userLocation.lng,
                r.fromCoords[0],
                r.fromCoords[1]
            );
            return distance <= selectedDistance;
        });
    }

    if (visibleRides.length === 0){
        ridesList.innerHTML = '<p class="status">لا توجد رحلات متاحة حالياً</p>';
        return;
    }

    visibleRides.forEach(r => {
        const left = r.seats - r.passengers.length;
        
        // حساب المسافة لعرضها
        let distanceText = '';
        if (currentRole === 'راكب' && userLocation) {
            const distance = calculateDistance(
                userLocation.lat, 
                userLocation.lng,
                r.fromCoords[0],
                r.fromCoords[1]
            );
            if (distance < 1000) {
                distanceText = `<br><b>المسافة:</b> ${Math.round(distance)} متر`;
            } else {
                distanceText = `<br><b>المسافة:</b> ${(distance/1000).toFixed(1)} كم`;
            }
        }

        const div = document.createElement('div');
        div.className = 'ride';
        div.innerHTML = `
            <div class="badge ${r.direction === 'to_university' ? 'to_university' : 'from_university'}">
                ${left} مقاعد<br>
                ${r.direction === 'to_university' ? 'إلى الجامعة' : 'العودة'}
            </div>
            <b>من:</b> ${r.from}<br>
            <b>إلى:</b> ${r.to}<br>
            <b>اليوم:</b> ${r.day} ${r.time}<br>
            <b>سعر المقعد:</b> ${r.seatPrice} دج
            ${distanceText}
            <br><b>هاتف السائق:</b> ${r.phone}
        `;

        if (currentRole === 'راكب' && left > 0){
            const btn = document.createElement('button');
            btn.textContent = 'احجز';
            btn.onclick = () => bookRide(r.id);
            div.appendChild(btn);
        }

        if (currentRole === 'سائق' && r.driverUid === currentUser.uid){
            if (r.passengers.length > 0){
                div.innerHTML += '<br><b>الركاب:</b><br>' +
                    r.passengers.map(p => `- ${p.name} (${p.phone})`).join('<br>');
            }
            const delBtn = document.createElement('button');
            delBtn.textContent = 'حذف الرحلة';
            delBtn.style.background = '#c0392b';
            delBtn.onclick = () => deleteRide(r.id);
            div.appendChild(delBtn);
        }

        const routeBtn = document.createElement('button');
        routeBtn.textContent = 'عرض المسار';
        const mapContainer = document.createElement('div');
        mapContainer.style.height = '200px';
        mapContainer.style.borderRadius = '10px';
        mapContainer.style.marginTop = '10px';
        mapContainer.style.display = 'none';
        div.appendChild(mapContainer);

        routeBtn.onclick = () => {
            if (mapContainer.style.display === 'none'){
                mapContainer.style.display = 'block';
                mapContainer.innerHTML = '';
                const mapRoute = L.map(mapContainer).setView(r.fromCoords, 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18}).addTo(mapRoute);
                L.Routing.control({
                    waypoints: [
                        L.latLng(r.fromCoords[0], r.fromCoords[1]),
                        L.latLng(r.toCoords[0], r.toCoords[1])
                    ],
                    routeWhileDragging: false
                }).addTo(mapRoute);
                setTimeout(() => mapRoute.invalidateSize(), 200);
            } else {
                mapContainer.style.display = 'none';
            }
        };
        div.appendChild(routeBtn);

        ridesList.appendChild(div);
    });
}
</script>
